name: build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Fetch the plugin jars the build compiles against
        run: |
          set -eu
          mkdir -p libs
          fetch() {
            curl -fsSL --retry 3 -o "libs/$1" "$2"
            echo "$3  libs/$1" | sha256sum -c -
          }
          fetch advancedregionmarket-3.5.5.jar \
            https://github.com/alex9849/advanced-region-market/releases/download/3.5.5/advancedregionmarket-3.5.5.jar \
            a6a43ab319c62e360d5b8d720756111398a34aefc5277d973f369253944e484a
          fetch Citizens-2.0.43-b4220.jar \
            https://ci.citizensnpcs.co/job/Citizens2/4220/artifact/dist/target/Citizens-2.0.43-b4220.jar \
            b19f63a7193c606380659e0178e0249feea8db9cded49bd3f4ca4dedb07e617d
          fetch floodgate-2.2.5-b138-fc99cfc.jar \
            https://download.geysermc.org/v2/projects/floodgate/versions/2.2.5/builds/138/downloads/spigot \
            44bdb908e2fb4ff1b974d5313d048a625a21555a9844cfb86256a98e8e1c6bd1

      - name: Build and test
        run: sh gradlew build --no-daemon

      - name: Adapter tests
        run: sh gradlew :adapter-griefprevention:test :adapter-realty:test -Padapters --no-daemon
