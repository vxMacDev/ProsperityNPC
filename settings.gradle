rootProject.name = 'ProsperityNPC'
// The adapter API ships inside the plugin jar. The example adapter is DEV only and never released.
include 'api'
include 'adapter-example'
project(':adapter-example').projectDir = file('adapters/example')

// Vendor adapters build only with -Padapters. GriefPrevention and Realty are in this tree; no vendor jar is released.
if (providers.gradleProperty('adapters').isPresent()) {
    ['griefprevention', 'realty'].each { name ->
        include "adapter-${name}"
        project(":adapter-${name}").projectDir = file("adapters/${name}")
    }
}
